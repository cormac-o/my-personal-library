<h1 class="text-3xl font-bold mb-6">Books</h1>

<p>Length: {{ books_list().length }}</p>

<div class="grid gap-4 p-6">
  @for (book of books_list(); track book.media_id) {
    
    <div class="p-4 border rounded-lg shadow" [routerLink]="['/books', book.media_id]">
      <h3 class="text-xl font-bold">{{ book.title }}</h3>
      <p>Author: {{ book.author }}</p>
      <p>Year: {{ book.year }}</p>
      <a (click)="goToBook(book.media_id)" class="text-blue-500 hover:text-blue-700">More info -></a>
    </div>
  }
</div>
