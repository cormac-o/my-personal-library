<div class="min-h-screen flex items-center justify-center bg-slate-950 px-6">
  <div class="text-center">
    <h1
      class="text-5xl md:text-7xl font-extrabold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mb-8"
    >
      My Personal Media Library
    </h1>

    <p class="text-slate-400 text-lg mb-10">
      Build something amazing with Angular & Tailwind CSS
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <button
        [routerLink]="['/books']"
        class="px-6 py-3 bg-cyan-500 hover:bg-cyan-600 text-white font-medium rounded-xl shadow-lg transition-all duration-200"
      >
        Books
      </button>

      <button
        class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white font-medium rounded-xl shadow-lg transition-all duration-200"
      >
        Button Two
      </button>

      <button
        class="px-6 py-3 border border-cyan-500 text-cyan-400 hover:bg-cyan-500 hover:text-white font-medium rounded-xl transition-all duration-200"
      >
        Button Three
      </button>
    </div>
  </div>
</div>
